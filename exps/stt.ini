[Arguments]

# Draft defaults for review; not a finalized research comparison or training budget.
project_name = Transformer_STT
result_subdir = Transformer_STT-LibriSpeech

# Acoustic model: random initialization, offline transcription.
model_type = Transformer_STT
model_options = {"vocab_size": 29, "n_mels": 80, "channels": [16, 32], "d_model": 128, "nhead": 4, "num_layers": 2, "dim_feedforward": 512, "dropout": 0.1}

# Explicit download opt-in. No data or models are downloaded on import.
dataset = LibriSpeech
dataset_options = {"train_split": "train-clean-100", "dev_split": "dev-clean", "test_split": "test-clean", "download": true, "feature_options": {"sample_rate": 16000, "n_mels": 80, "n_fft": 400, "hop_length": 160}, "duration_batching": true}
features_path = ./data

control_type = STT
loss_type = CTC
loss_options = {"blank": 0}
evaluation_type_1 = WordErrorRate
evaluation_options_1 = {}

# Float32 first; backend compatibility is unverified for this replacement.
precision = 32
batch_size_train = 4
batch_size_val = 4
batch_size_test = 4
nthreads = 0
ngpu = 1
manual_seed = 17
nepochs = 30
check_val_every_n_epochs = 1

# Retain the framework's manual optimizer and epoch-based scheduler.
optim_method = AdamW
learning_rate = 0.0003
optim_options = {"weight_decay": 0.01}
gradient_clip = 5.0
scheduler_method = StepLR
scheduler_options = {"step_size": 20, "gamma": 0.5}

EarlyStopping = False
earlystop_options = {"monitor": "val_loss", "min_delta": 0.0001, "patience": 7, "mode": "min"}
